<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Flashbrick Lab builds thoughtful tools for photography.">
  <title>Flashbrick Lab</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 70% 15%, rgba(19, 211, 189, .13), transparent 34rem),
        #101411;
      color: #f5f4ed;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }
    main { width: min(100%, 680px); }
    .mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 12px;
      background: #202621;
      color: #ffe500;
      font: 700 13px ui-monospace, monospace;
    }
    p { margin: 22px 0 8px; color: #13d3bd; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(44px, 10vw, 78px); line-height: 1.02; letter-spacing: -.055em; }
    .note { margin-top: 20px; color: #aeb6ad; font-size: 17px; line-height: 1.65; letter-spacing: 0; text-transform: none; }
    a { color: #f5f4ed; text-underline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">FL</div>
    <p>Flashbrick Lab</p>
    <h1>Tools for deliberate photography.</h1>
    <p class="note">The full site is being prepared. For PreFrame policies and support, visit <a href="preframe/legal/">PreFrame Legal &amp; Support</a>.</p>
  </main>
</body>
</html>
